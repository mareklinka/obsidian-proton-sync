name: proton-drive-sync-opencode
services:
  dev:
    build:
      context: .
      dockerfile: ./dev/Dockerfile
    volumes:
      - proton-drive-sync-opencode-data:/root/.local/share/opencode
      - proton-drive-sync-claude-data:/claude
      # mount the source code into the container for live development
      - ../../:/source
      # mount the proxy CA cert so the dev container trusts SSL-bumped traffic
      - ./squid/squid-cert/squid-cert.pem:/usr/local/share/ca-certificates/squid-cert.crt:ro
      # these are security features
      # mount the .git directory read-only to prevent the model from tampering with the git history
      - ../../.git:/source/.git:ro
      # same thing for the opencode configuration file
      - ../opencode.base.json:/source/.opencode/opencode.json:ro
      - ../opencode.local.json:/home/root/.config/opencode/local/opencode.json:ro
      # and this hides the whole .opencode/container config from the model
      - ./nonexistent:/source/.opencode/container:ro
    working_dir: /source
    stdin_open: true
    tty: true
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'update-ca-certificates 2>/dev/null; exec opencode web --port 10000 --hostname 0.0.0.0 --print-logs'
      ]
    # some sensitive environment variables are passed via an .env file, which is not checked into source control
    # these include
    #  - NUGET_API_KEY (to allow non-interactive nuget restore)
    #  - ADO_MCP_AUTH_TOKEN (for ADO MCP server)
    environment:
      # Route all HTTP/HTTPS traffic through the proxy
      - HTTP_PROXY=http://web-proxy:3128
      - HTTPS_PROXY=http://web-proxy:3128
      # Trust proxy CA for Node.js (system store doesn't apply)
      - NODE_EXTRA_CA_CERTS=/usr/local/share/ca-certificates/squid-cert.crt
      - NO_PROXY=127.0.0.1,localhost,*.local,host-proxy
      - OPENCODE_CONFIG_DIR=/home/root/.config/opencode/local
      - OPENCODE_DISABLE_MODELS_FETCH=1
      - CLAUDE_CONFIG_DIR=/claude
    networks:
      internal:
        ipv4_address: 172.4.1.1
    depends_on:
      - web-proxy

  # Outbound HTTP/HTTPS proxy with domain whitelisting
  web-proxy:
    build:
      context: ./squid
      dockerfile: ./Dockerfile
    init: true
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - ./squid/squid-cert/squid-cert.pem:/etc/squid/ssl_cert/squid-cert.pem:ro
      - ./squid/squid-cert/squid-key.pem:/etc/squid/ssl_cert/squid-key.pem:ro
      - squid-ssl-db:/squid-data
    networks:
      internal:
        ipv4_address: 172.4.1.2
      bridge_host: # proxy bridges internal ↔ host for backend traffic

  host-proxy:
    image: nginx:alpine
    ports:
      - '10000:10000'
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/conf.d/default.conf.template:ro
      - ./nginx/nginx-entrypoint.sh:/etc/nginx/conf.d/entrypoint.sh:ro
    environment:
      - LOCAL_LLM_HOST_PORT=${LOCAL_LLM_HOST_PORT}
    entrypoint:
      - /bin/sh
      - /etc/nginx/conf.d/entrypoint.sh
    init: true
    networks:
      internal:
        ipv4_address: 172.4.1.3
      bridge_host:
    depends_on:
      - dev

networks:
  internal:
    internal: true
    ipam:
      config:
        - subnet: 172.4.0.0/16
          gateway: 172.4.100.1
  bridge_host:
    driver: bridge

volumes:
  proton-drive-sync-opencode-data:
  proton-drive-sync-claude-data:
  squid-ssl-db:
