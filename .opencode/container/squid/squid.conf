# Squid configuration with SSL bump and HTTP method controls

# ============================================================
# SSL Bump configuration
# ============================================================
# sslcrtd_program points to the SSL certificate database helper
sslcrtd_program /usr/lib/squid/security_file_certgen -s /squid-data/ssl_db -M 4MB

# Enable SSL bump on port 3128 with our self-signed certificate
http_port 3128 ssl-bump \
    generate-host-certificates=on \
    dynamic_cert_mem_cache_size=4MB \
    tls-cert=/etc/squid/ssl_cert/squid-cert.pem \
    tls-key=/etc/squid/ssl_cert/squid-key.pem

# ============================================================
# Response size limit
# ============================================================
reply_body_max_size 10 MB all

# ============================================================
# Port restrictions
# ============================================================
acl Safe_ports port 80 443
http_access deny !Safe_ports

# ============================================================
# Allowed destination domains
# ============================================================
acl TruestedDomains dstdomain \
    opencode.ai \
    registry.npmjs.org \
    api.github.com \
    .obsidian.md

# ============================================================
# Special-case whitelist
# =================================
acl DomainsWithPost dstdomain
acl PostMethod method POST

# ============================================================
# HTTP Method whitelist/blacklist
# ============================================================
# Whitelist: only GET and CONNECT is allowed
acl SafeMethods method GET CONNECT OPTIONS HEAD
request_body_max_size 0 !DomainsWithPost
request_body_max_size 1 MB DomainsWithPost

# SSL bump stages:
# 1. server-first: intercept the server's TLS handshake first (inspect SNI)
# 2. peek: peek at the client's TLS ClientHello to inspect SNI/host
# 3. splice: for allowed domains, pass traffic through (re-encrypted with generated cert)
ssl_bump server-first all
ssl_bump peek all
ssl_bump splice TruestedDomains

# ============================================================
# Access control
# ============================================================
# Allow whitelisted domains using allowed methods (POST only)
http_access allow TruestedDomains SafeMethods
http_access allow DomainsWithPost PostMethod

# Deny everything else
http_access deny all

# ============================================================
# Cache and logging
# ============================================================
access_log /dev/stdout
